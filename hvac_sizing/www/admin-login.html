<!doctype html>
<html lang="it" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131e">
  <title>Accesso alla app</title>
  <link rel="stylesheet" href="admin-login.css?v=0.16.2">
</head>
<body>
  <main class="login-card">
    <div class="login-top">
      <p class="eyebrow" data-t="eyebrow">DIMENSIONAMENTO CLIMATIZZAZIONE PRO</p>
      <div class="language" role="group" aria-label="Lingua / Sprache"><button type="button" data-lang="it">IT</button><button type="button" data-lang="de">DE</button></div>
    </div>
    <h1 data-t="title">Accesso alla app</h1>
    <p class="help" data-t="help">Inserisci nome utente e password. Per l’amministratore principale lascia vuoto il nome utente e usa la password delle opzioni dell’add-on.</p>
    <form id="admin-login-form">
      <label><span data-t="username">Nome utente</span><input id="app-username" name="username" autocomplete="username" autocapitalize="none" maxlength="60"></label>
      <label><span data-t="password">Password</span>
        <input id="admin-password" name="password" type="password" minlength="10" required autocomplete="current-password">
      </label>
      <div id="admin-login-error" class="error hidden" role="alert"></div>
      <button id="admin-login-submit" type="submit" data-t="submit">Accedi</button>
    </form>
    <p class="security" data-t="security">Connessione protetta · sessione temporanea di 8 ore</p>
  </main>
  <script src="admin-login.js?v=0.16.2"></script>
</body>
</html>
